name: Build DialektPlay site and audio
on:
  push:
    paths:
      - "scripts/upgrade_site.py"
      - "scripts/generate_audio.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install audio tools
        run: sudo apt-get update && sudo apt-get install -y espeak ffmpeg
      - name: Upgrade site
        run: python3 scripts/upgrade_site.py
      - name: Decode and generate local MP3 clips
        run: python3 scripts/generate_audio.py && python3 generate_audio_payload.py
      - name: Commit generated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html audio/ generate_audio_payload.py
          git diff --cached --quiet && exit 0
          git commit -m "Add local DialektPlay audio and profile XP system"
          git push
