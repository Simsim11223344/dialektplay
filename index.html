<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DialektPlay – svenska dialekter</title>
<style>
:root{--bg:#030914;--panel:#071a2d;--panel2:#0a2440;--line:#173c5c;--blue:#1687ff;--cyan:#55d2ff;--text:#f4f8fc;--muted:#91a9c1;--green:#20d99a;--red:#ff5d78}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 75% 0,#123c65 0,#061323 34%,#030914 75%);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit}.layout{min-height:100vh}.sidebar{position:fixed;left:0;top:0;bottom:0;width:235px;background:#020a13ee;border-right:1px solid var(--line);padding:18px;z-index:10}.logo{font-size:22px;font-weight:900;margin:7px}.logo span{color:var(--cyan)}.nav{display:grid;gap:6px;margin-top:25px}.nav button{border:0;background:transparent;color:#a8bad0;text-align:left;padding:13px;border-radius:12px;cursor:pointer}.nav button:hover,.nav button.active{background:#0b477c;color:white}.content{margin-left:235px;padding:24px;max-width:1500px}.topbar{display:flex;justify-content:space-between;align-items:center}.user{display:flex;gap:10px;align-items:center}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--blue),#164f9d);font-weight:900}.hero,.card{background:linear-gradient(145deg,#0a2036,#061323);border:1px solid var(--line);border-radius:20px}.hero{padding:36px;margin-top:18px}.hero h1{font-size:clamp(38px,6vw,68px);line-height:1;margin:0}.hero h1 span{color:var(--cyan)}.hero p{max-width:750px;color:#a9bdd1;font-size:17px;line-height:1.55}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid #235d8d;background:#0a2947;color:white;padding:11px 15px;border-radius:11px;cursor:pointer;font-weight:800}.primary{background:linear-gradient(135deg,#0789ff,#1764e8);border-color:#2c9cff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:15px}.card{padding:18px}.card h2,.card h3{margin-top:5px}.muted{color:var(--muted)}.stat b{font-size:30px;display:block;margin-top:6px}.search,.select{width:100%;padding:13px;border-radius:11px;background:#061321;color:white;border:1px solid var(--line);outline:none}.dialects{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:12px}.dialect{padding:16px;border:1px solid var(--line);background:#07172a;border-radius:15px}.pill{display:inline-block;background:#0d3153;color:#78cdfc;border-radius:99px;padding:5px 9px;font-size:12px}.progress{height:9px;background:#10263c;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan))}.quiz-options{display:grid;grid-template-columns:1fr 1fr;gap:10px}.answer{border:1px solid var(--line);background:#091c31;color:white;padding:15px;border-radius:12px;text-align:left;cursor:pointer}.answer.correct{background:#073e32;border-color:var(--green)}.answer.wrong{background:#45162a;border-color:var(--red)}.notice{padding:13px;border-radius:12px;margin-top:12px;background:#0b2741}.map{height:390px;position:relative;overflow:hidden;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,#06192c,#03101d)}.map:after{content:"SVERIGE";position:absolute;inset:0;display:grid;place-items:center;color:#0e3655;font-size:65px;font-weight:1000;transform:rotate(-10deg);pointer-events:none}.pin{position:absolute;z-index:2;width:44px;height:44px;border:0;border-radius:50%;background:var(--blue);color:white;font-weight:900;cursor:pointer}.pin1{left:56%;top:8%}.pin2{left:45%;top:27%}.pin3{left:36%;top:45%}.pin4{left:27%;top:64%}.pin5{left:55%;top:69%}.modal{display:none;position:fixed;inset:0;background:#000c;z-index:30;place-items:center;padding:15px}.modal.show{display:grid}.modalbox{width:min(760px,100%);max-height:90vh;overflow:auto;background:#061323;border:1px solid #1d629b;border-radius:20px;padding:23px}.close{float:right;background:#10263c;color:white;border:0;border-radius:9px;padding:7px 10px;cursor:pointer}.list{display:grid;gap:9px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px;border:1px solid var(--line);border-radius:12px;background:#07172a}
@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.dialects{grid-template-columns:repeat(2,1fr)}}@media(max-width:680px){.sidebar{top:auto;bottom:0;width:100%;height:68px;padding:4px;border:0;border-top:1px solid var(--line)}.logo{display:none}.nav{display:flex;justify-content:space-around;margin:0}.nav button{font-size:10px;padding:7px;text-align:center}.content{margin:0;padding:13px 13px 82px}.grid,.dialects,.quiz-options{grid-template-columns:1fr}.hero{padding:23px}.hero h1{font-size:42px}}
</style>
</head>
<body>
<div class="layout">
<aside class="sidebar">
  <div class="logo">♫ <span>DialektPlay</span></div>
  <nav class="nav">
    <button id="n0" onclick="showHome()">⌂ Hem</button>
    <button id="n1" onclick="startQuiz()">🎧 Quiz</button>
    <button id="n2" onclick="showGames()">🎮 Spel</button>
    <button id="n3" onclick="showDialects()">🗺️ Dialekter</button>
    <button id="n4" onclick="showCompare()">⚖️ Jämför</button>
    <button id="n5" onclick="showStats()">📊 Statistik</button>
  </nav>
</aside>
<main class="content">
  <div class="topbar"><span class="muted" id="crumb">Hem</span><div class="user"><div><b>SimSim</b><br><small class="muted">Nivå <span id="level">1</span> · <span id="xp">0</span> XP</small></div><div class="avatar">S</div></div></div>
  <div id="app"></div>
</main>
</div>
<div class="modal" id="modal"><div class="modalbox"><button class="close" onclick="closeModal()">✕</button><div id="modalBody"></div></div></div>

<script>
const DIALECTS=[
["Skåne","Sydsvenska mål"],["Blekinge","Sydsvenska mål"],["Södra Halland","Sydsvenska mål"],["Södra Småland","Sydsvenska mål"],["Bohuslän","Götamål"],["Dalsland","Götamål"],["Göteborg","Götamål"],["Norra Halland","Götamål"],["Norra Småland","Götamål"],["Värmland","Götamål"],["Västergötland","Götamål"],["Gotländska mål","Gotländska mål"],["Hälsingland","Norrländska mål"],["Härjedalen","Norrländska mål"],["Jämtland","Norrländska mål"],["Lappland","Norrländska mål"],["Medelpad","Norrländska mål"],["Norrbotten","Norrländska mål"],["Västerbotten","Norrländska mål"],["Ångermanland","Norrländska mål"],["Bergslagsmål","Sveamål"],["Dalarna","Sveamål"],["Gästrikland","Sveamål"],["Närke","Sveamål"],["Södermanland","Sveamål"],["Uppland","Sveamål"],["Västmanland","Sveamål"],["Östergötland","Östsvenska mål"],["Öland","Sydsvenska mål"]
];
const ISOF="https://www.isof.se/dialekter/lyssna-pa-dialekter";
let data=JSON.parse(localStorage.getItem("dialektplay")||'{"xp":0,"answered":0,"correct":0,"streak":0}');
function save(){localStorage.setItem("dialektplay",JSON.stringify(data));document.getElementById("xp").textContent=data.xp;document.getElementById("level").textContent=Math.floor(data.xp/100)+1}
function page(title,html){document.getElementById("crumb").textContent=title;document.getElementById("app").innerHTML=html;save()}
function active(n){for(let i=0;i<6;i++){let b=document.getElementById("n"+i);if(b)b.classList.toggle("active",i===n)}}
function showHome(){active(0);page("Hem",'<section class="hero"><h1>Lär dig svenska <span>dialekter.</span></h1><p>DialektPlay samlar träning, quiz, minispel och utforskning av svenska dialektområden i en modern webbapp.</p><div class="actions"><button class="btn primary" onclick="startQuiz()">🎧 Starta quiz</button><button class="btn" onclick="showDialects()">🗺️ Utforska dialekter</button></div></section><div class="grid"><div class="card stat"><span class="muted">XP</span><b>'+data.xp+'</b><span class="muted">Nivå '+(Math.floor(data.xp/100)+1)+'</span></div><div class="card stat"><span class="muted">Frågor</span><b>'+data.answered+'</b><span class="muted">besvarade</span></div><div class="card stat"><span class="muted">Träffsäkerhet</span><b>'+(data.answered?Math.round(data.correct/data.answered*100):0)+'%</b></div><div class="card"><span class="pill">🔥 Daglig</span><h3>5 frågor</h3><p class="muted">Samla XP och bygg din streak.</p></div></div>')}
let quizList=[],quizIndex=0;
function startQuiz(){active(1);quizList=DIALECTS.slice().sort(()=>Math.random()-.5).slice(0,10);quizIndex=0;openQuizQuestion()}
function openQuizQuestion(){let q=quizList[quizIndex];let opts=[q[0],...DIALECTS.filter(x=>x[0]!==q[0]).sort(()=>Math.random()-.5).slice(0,3).map(x=>x[0])].sort(()=>Math.random()-.5);document.getElementById("modalBody").innerHTML='<p class="muted">Fråga '+(quizIndex+1)+' av 10</p><h2>Vilket dialektområde hör <b>'+q[1]+'</b> till?</h2><div class="quiz-options">'+opts.map(o=>'<button class="answer" onclick="answerQuiz(this,'+JSON.stringify(o)+','+JSON.stringify(q[0])+')">'+o+'</button>').join("")+'</div><div id="quizFeedback"></div>';document.getElementById("modal").classList.add("show")}
function answerQuiz(btn,answer,right){if(btn.dataset.done)return;btn.dataset.done="1";data.answered++;if(answer===right){btn.classList.add("correct");data.correct++;data.streak++;data.xp+=20;document.getElementById("quizFeedback").innerHTML='<div class="notice">✅ Rätt! +20 XP</div>'}else{btn.classList.add("wrong");data.streak=0;document.getElementById("quizFeedback").innerHTML='<div class="notice">❌ Rätt svar är <b>'+right+'</b>.</div>'}save();setTimeout(()=>{quizIndex++;if(quizIndex<10)openQuizQuestion();else{closeModal();showHome()}},650)}
function showGames(){active(2);page("Spel",'<h1>Minigames</h1><p class="muted">Korta träningslägen.</p><div class="grid"><div class="card"><h2>⚡ Speed Quiz</h2><p>En slumpad fråga med fyra svar.</p><button class="btn primary" onclick="speedQuiz()">Spela</button></div><div class="card"><h2>🎯 Streak</h2><p>Försök få tre rätt i rad.</p><button class="btn primary" onclick="streakGame()">Spela</button></div><div class="card"><h2>🗺️ Kartkoll</h2><p>Testa din koll på Sveriges dialektområden.</p><button class="btn primary" onclick="mapGame()">Spela</button></div></div>')}
function speedQuiz(){let q=DIALECTS[Math.floor(Math.random()*DIALECTS.length)],opts=[q[0],...DIALECTS.filter(x=>x[0]!==q[0]).sort(()=>Math.random()-.5).slice(0,3).map(x=>x[0])].sort(()=>Math.random()-.5);document.getElementById("modalBody").innerHTML='<h2>⚡ Speed Quiz</h2><p>Vilket område är <b>'+q[1]+'</b>?</p><div class="quiz-options">'+opts.map(o=>'<button class="answer" onclick="gameAnswer(this,'+JSON.stringify(o)+','+JSON.stringify(q[0])+')">'+o+'</button>').join("")+'</div><div id="gameFeedback"></div>';document.getElementById("modal").classList.add("show")}
function gameAnswer(btn,a,r){if(btn.dataset.done)return;btn.dataset.done="1";if(a===r){btn.classList.add("correct");data.xp+=10;document.getElementById("gameFeedback").innerHTML="✅ Rätt! +10 XP"}else{btn.classList.add("wrong");document.getElementById("gameFeedback").innerHTML="❌ Rätt svar: "+r}save()}
function streakGame(){let n=0;function next(){let q=DIALECTS[Math.floor(Math.random()*DIALECTS.length)],opts=[q[0],...DIALECTS.filter(x=>x[0]!==q[0]).sort(()=>Math.random()-.5).slice(0,3).map(x=>x[0])].sort(()=>Math.random()-.5);document.getElementById("modalBody").innerHTML='<h2>🎯 Streak</h2><p>Rätt i rad: <b>'+n+'/3</b></p><div class="quiz-options">'+opts.map(o=>'<button class="answer" onclick="streakAnswer(this,'+JSON.stringify(o)+','+JSON.stringify(q[0])+')">'+o+'</button>').join("")+'</div><div id="gameFeedback"></div>';document.getElementById("modal").classList.add("show")}window.streakAnswer=function(btn,a,r){if(btn.dataset.done)return;btn.dataset.done="1";if(a===r){btn.classList.add("correct");n++;data.xp+=10;save();if(n===3){data.xp+=30;save();document.getElementById("gameFeedback").innerHTML="🔥 3 rätt i rad! +30 bonus XP"}else setTimeout(next,450)}else{btn.classList.add("wrong");n=0;document.getElementById("gameFeedback").innerHTML="❌ Streak bruten. Försök igen."}};next()}
function mapGame(){document.getElementById("modalBody").innerHTML='<h2>🗺️ Kartkoll</h2><p>Vilken punkt ligger längst norrut?</p><div class="map"><button class="pin pin1" onclick="mapAnswer(this,true)">1</button><button class="pin pin2" onclick="mapAnswer(this,false)">2</button><button class="pin pin3" onclick="mapAnswer(this,false)">3</button><button class="pin pin4" onclick="mapAnswer(this,false)">4</button><button class="pin pin5" onclick="mapAnswer(this,false)">5</button></div><div id="gameFeedback"></div>';document.getElementById("modal").classList.add("show")}
function mapAnswer(btn,ok){if(ok){data.xp+=15;save();document.getElementById("gameFeedback").innerHTML="✅ Rätt! +15 XP"}else document.getElementById("gameFeedback").innerHTML="❌ Inte den punkten."}
function showDialects(){active(3);page("Dialekter",'<h1>Dialektområden</h1><p class="muted">Utforska '+DIALECTS.length+' svenska områden.</p><input id="dialectSearch" class="search" placeholder="🔎 Sök dialektområde..." oninput="filterDialects()"><div id="dialectList" class="dialects">'+DIALECTS.map((d,i)=>'<article class="dialect"><span class="pill">'+d[1]+'</span><h3>'+d[0]+'</h3><button class="btn" onclick="openDialect('+i+')">Öppna</button> <button class="btn" onclick="window.open(ISOF,\'_blank\')">🎧 Lyssna</button></article>').join("")+'</div>')}
function filterDialects(){let v=document.getElementById("dialectSearch").value.toLowerCase();document.querySelectorAll(".dialect").forEach((e,i)=>e.style.display=(DIALECTS[i][0]+" "+DIALECTS[i][1]).toLowerCase().includes(v)?"block":"none")}
function openDialect(i){let d=DIALECTS[i];document.getElementById("modalBody").innerHTML='<span class="pill">'+d[1]+'</span><h2>'+d[0]+'</h2><p class="muted">Dialekter kan variera inom samma område.</p><div class="card"><h3>🎧 Autentiskt ljud</h3><p>ISOF har ett stort offentligt dialektmaterial med inspelningar.</p><button class="btn primary" onclick="window.open(ISOF,\'_blank\')">Öppna ISOF</button></div><div class="card"><h3>🔊 Övningsljud</h3><p>Webbläsarens svenska röst kan läsa upp ett exempel.</p><button class="btn" onclick="speak('+JSON.stringify(d[0])+')">▶ Läs upp</button></div>';document.getElementById("modal").classList.add("show")}
function speak(text){if("speechSynthesis" in window){let u=new SpeechSynthesisUtterance(text);u.lang="sv-SE";speechSynthesis.cancel();speechSynthesis.speak(u)}}
function showCompare(){active(4);page("Jämför",'<h1>Jämför dialekter</h1><div class="grid"><div class="card"><label>Område 1</label><select class="select" id="compareA">'+DIALECTS.map((d,i)=>'<option value="'+i+'">'+d[0]+'</option>').join("")+'</select></div><div class="card"><label>Område 2</label><select class="select" id="compareB">'+DIALECTS.map((d,i)=>'<option value="'+i+'" '+(i===1?"selected":"")+'>'+d[0]+'</option>').join("")+'</select></div></div><div class="card" id="comparison" style="margin-top:12px"></div>');document.getElementById("compareA").onchange=renderCompare;document.getElementById("compareB").onchange=renderCompare;renderCompare()}
function renderCompare(){let a=DIALECTS[document.getElementById("compareA").value],b=DIALECTS[document.getElementById("compareB").value];document.getElementById("comparison").innerHTML='<div class="grid"><div><span class="pill">'+a[1]+'</span><h2>'+a[0]+'</h2></div><div><span class="pill">'+b[1]+'</span><h2>'+b[0]+'</h2></div></div><p class="muted">Områdena tillhör '+(a[1]===b[1]?"samma större dialektområde.":"olika större dialektområden.")+' Öppna ISOF-materialet för att höra verkliga inspelningar.</p><button class="btn primary" onclick="window.open(ISOF,\'_blank\')">🎧 Öppna ljudmaterial</button>'}
function showStats(){active(5);let acc=data.answered?Math.round(data.correct/data.answered*100):0;page("Statistik",'<h1>Din statistik</h1><div class="grid"><div class="card stat"><span class="muted">XP</span><b>'+data.xp+'</b></div><div class="card stat"><span class="muted">Nivå</span><b>'+(Math.floor(data.xp/100)+1)+'</b></div><div class="card stat"><span class="muted">Frågor</span><b>'+data.answered+'</b></div><div class="card stat"><span class="muted">Rätt</span><b>'+acc+'%</b></div></div><div class="card" style="margin-top:12px"><h2>Nästa nivå</h2><div class="progress"><i style="width:'+(data.xp%100)+'%"></i></div><p class="muted">'+(100-data.xp%100)+' XP kvar.</p><button class="btn" onclick="resetStats()">Återställ statistik</button></div>')}
function resetStats(){data={xp:0,answered:0,correct:0,streak:0};save();showStats()}
function closeModal(){document.getElementById("modal").classList.remove("show")}
showHome();
</script>

<style>
.audio{width:100%;margin:14px 0}.shop{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.shopItem{padding:15px;border:1px solid var(--line);border-radius:15px;background:#07172a}.shopItem.owned{border-color:#2071a8}.locked{opacity:.55}.tag{font-size:11px;color:#78cdfc}.profilePreview{padding:25px;border-radius:18px;border:1px solid var(--line);min-height:150px;display:flex;align-items:center;gap:18px;background:#07172a}.bigAvatar{width:78px;height:78px;border-radius:24px;display:grid;place-items:center;font-size:30px;font-weight:1000;background:linear-gradient(135deg,var(--blue),#164f9d)}.font-neon{font-family:Impact,Haettenschweiler,'Arial Narrow Bold',sans-serif}.font-mono{font-family:ui-monospace,SFMono-Regular,monospace}.bg-space{background:radial-gradient(circle at 70% 20%,#3153a5,#080b20 45%,#02040b)}.bg-grid{background-image:linear-gradient(#1b4165 1px,transparent 1px),linear-gradient(90deg,#1b4165 1px,transparent 1px);background-size:22px 22px}.bg-purple{background:radial-gradient(circle at 20% 20%,#5b2ca0,#11132e 45%,#05050c)}
@media(max-width:680px){.shop{grid-template-columns:1fr}}
</style>
<script>
const DP_AUDIO={"Skåne":"skane","Blekinge":"blekinge","Södra Halland":"sodra-halland","Södra Småland":"sodra-smaland","Bohuslän":"bohuslan","Dalsland":"dalsland","Göteborg":"goteborg","Norra Halland":"norra-halland","Norra Småland":"norra-smaland","Värmland":"varmland","Västergötland":"vastergotland","Gotländska mål":"gotland","Hälsingland":"halsingland","Härjedalen":"harjedalen","Jämtland":"jamtland","Lappland":"lappland","Medelpad":"medelpad","Norrbotten":"norrbotten","Västerbotten":"vasterbotten","Ångermanland":"angermanland","Bergslagsmål":"bergslagsmal","Dalarna":"dalarna","Gästrikland":"gastrikland","Närke":"narke","Södermanland":"sodermanland","Uppland":"uppland","Västmanland":"vastmanland","Östergötland":"ostergotland","Öland":"oland"};
const DP_REWARDS=[[1,"Startprofil","Gratis"],[2,"🟦 Blå neon","Bakgrund"],[3,"✦ Stjärnavatar","Avatar"],[4,"🟪 Lila space","Bakgrund"],[5,"⚡ Neontext","Textstil"],[6,"🟩 Grid","Bakgrund"],[7,"🎧 Audio Master","Profilbadge"],[8,"🔷 Cyan avatar","Avatar"],[9,"⌘ Mono","Textstil"],[10,"🔥 Streak-profil","Profilbadge"],[12,"🌌 Deep Space","Bakgrund"],[15,"👑 Elite","Avatar"],[20,"💎 DialektLegend","Profilbadge"]];
const DP_SHOP=[{id:'bg-blue',name:'Blue Neon',type:'Bakgrund',cost:120,level:2,cls:''},{id:'bg-purple',name:'Purple Space',type:'Bakgrund',cost:180,level:4,cls:'bg-purple'},{id:'bg-grid',name:'Cyber Grid',type:'Bakgrund',cost:240,level:6,cls:'bg-grid'},{id:'bg-space',name:'Deep Space',type:'Bakgrund',cost:350,level:12,cls:'bg-space'},{id:'font-neon',name:'Neontext',type:'Textstil',cost:160,level:5,cls:'font-neon'},{id:'font-mono',name:'Mono',type:'Textstil',cost:220,level:9,cls:'font-mono'},{id:'avatar-cyan',name:'Cyan Avatar',type:'Avatar',cost:140,level:8,cls:''},{id:'avatar-elite',name:'Elite Avatar',type:'Avatar',cost:450,level:15,cls:''}];
function dpLoad(){return JSON.parse(localStorage.getItem('dialektplay')||'null')||{xp:0,answered:0,correct:0,streak:0,coins:0,name:'SimSim',owned:['start'],bg:'',font:'',avatar:'default',badges:[]}}
let DP=dpLoad();
function dpLevel(){return Math.floor(DP.xp/100)+1}function dpSave(){localStorage.setItem('dialektplay',JSON.stringify(DP));document.getElementById('xp').textContent=DP.xp;document.getElementById('level').textContent=dpLevel();if(document.getElementById('coins'))document.getElementById('coins').textContent=DP.coins;document.getElementById('topAvatar').textContent=DP.avatar==='avatar-elite'?'👑':DP.avatar==='avatar-cyan'?'✦':'S'}function dpGain(x,c){let old=dpLevel();DP.xp+=x;DP.coins+=c;dpSave();if(dpLevel()>old){document.getElementById('modalBody').innerHTML='<h1>🎉 Nivå '+dpLevel()+'!</h1><p>Du har låst upp nya saker i ditt <b>XP Pass</b>.</p><button class="btn primary" onclick="closeModal();showProfile()">Öppna XP Pass</button>';document.getElementById('modal').classList.add('show')}}
function dpAudio(slug){return '<audio class="audio" controls preload="metadata"><source src="audio/'+slug+'.mp3" type="audio/mpeg"></audio><p class="muted">🎧 DialektPlay · cirka 15 sekunder</p>'}function dpPlay(){setTimeout(()=>document.querySelector('#modalBody audio')?.play().catch(()=>{}),180)}
let DPQ=[],DPQI=0;function startQuiz(){active(1);DPQ=DIALECTS.slice().sort(()=>Math.random()-.5).slice(0,10);DPQI=0;dpQuiz()}function dpQuiz(){let q=DPQ[DPQI],o=[q[0],...DIALECTS.filter(x=>x[0]!==q[0]).sort(()=>Math.random()-.5).slice(0,3).map(x=>x[0])].sort(()=>Math.random()-.5);document.getElementById('modalBody').innerHTML='<p class="muted">Fråga '+(DPQI+1)+' av 10</p><h2>🎧 Vilken dialekt hör du?</h2>'+dpAudio(DP_AUDIO[q[0]])+'<div class="quiz-options">'+o.map(x=>'<button class="answer" onclick="dpAnswer(this,'+JSON.stringify(x)+','+JSON.stringify(q[0])+')">'+x+'</button>').join('')+'</div><div id="quizFeedback"></div>';document.getElementById('modal').classList.add('show');dpPlay()}function dpAnswer(b,a,r){if(b.dataset.done)return;b.dataset.done=1;DP.answered++;if(a===r){b.classList.add('correct');DP.correct++;DP.streak++;dpGain(20,12);document.getElementById('quizFeedback').textContent='✅ Rätt! +20 XP och +12 🪙'}else{b.classList.add('wrong');DP.streak=0;dpSave();document.getElementById('quizFeedback').textContent='❌ Rätt svar: '+r}setTimeout(()=>{DPQI++;DPQI<10?dpQuiz():(closeModal(),showHome())},900)}
function showGames(){active(2);page('Spel','<h1>Minigames</h1><p class="muted">Alla spel använder DialektPlay-ljud.</p><div class="grid"><div class="card"><h2>⚡ Speed Audio</h2><p>Hör ett klipp och svara snabbt.</p><button class="btn primary" onclick="dpSpeed()">Spela</button></div><div class="card"><h2>🎯 Streak</h2><p>Tre ljud rätt i rad.</p><button class="btn primary" onclick="dpStreak()">Spela</button></div></div>')}function dpSpeed(){let q=DIALECTS[Math.floor(Math.random()*DIALECTS.length)],o=[q[0],...DIALECTS.filter(x=>x[0]!==q[0]).sort(()=>Math.random()-.5).slice(0,3).map(x=>x[0])].sort(()=>Math.random()-.5);document.getElementById('modalBody').innerHTML='<h2>⚡ Speed Audio</h2>'+dpAudio(DP_AUDIO[q[0]])+'<div class="quiz-options">'+o.map(x=>'<button class="answer" onclick="dpGameAnswer(this,'+JSON.stringify(x)+','+JSON.stringify(q[0])+')">'+x+'</button>').join('')+'</div><div id="gameFeedback"></div>';document.getElementById('modal').classList.add('show');dpPlay()}function dpGameAnswer(b,a,r){if(b.dataset.done)return;b.dataset.done=1;if(a===r){b.classList.add('correct');dpGain(10,6);document.getElementById('gameFeedback').textContent='✅ Rätt! +10 XP och +6 🪙'}else{b.classList.add('wrong');document.getElementById('gameFeedback').textContent='❌ Rätt svar: '+r}}function dpStreak(){dpSpeed()}
function showDialects(){active(3);page('Dialekter','<h1>Dialektområden</h1><p class="muted">Varje område har ett eget DialektPlay-klipp.</p><input id="dialectSearch" class="search" placeholder="🔎 Sök dialektområde..." oninput="filterDialects()"><div id="dialectList" class="dialects">'+DIALECTS.map((d,i)=>'<article class="dialect"><span class="pill">'+d[1]+'</span><h3>'+d[0]+'</h3><button class="btn primary" onclick="openDialect('+i+')">🎧 Lyssna</button></article>').join('')+'</div>')}function openDialect(i){let d=DIALECTS[i];document.getElementById('modalBody').innerHTML='<span class="pill">'+d[1]+'</span><h2>'+d[0]+'</h2><p>Eget DialektPlay-övningsklipp, cirka 15 sekunder.</p>'+dpAudio(DP_AUDIO[d[0]])+'<div class="notice">💡 Samma ljud används i quizet.</div>';document.getElementById('modal').classList.add('show')}
function showProfile(){active(6);page('Profil','<h1>👤 Din profil</h1><div class="profilePreview '+DP.font+' '+DP.bg+'"><div class="bigAvatar">'+(DP.avatar==='avatar-elite'?'👑':DP.avatar==='avatar-cyan'?'✦':'S')+'</div><div><h2>'+DP.name+'</h2><p class="muted">Nivå '+dpLevel()+' · '+DP.xp+' XP · '+DP.coins+' 🪙</p><span class="pill">XP Pass</span></div></div><div class="card" style="margin-top:12px"><h2>🎟️ XP Pass</h2><p class="muted">Levla upp och lås upp profilgrejer. Inga riktiga pengar.</p><div class="progress"><i style="width:'+(DP.xp%100)+'%"></i></div><div class="list" style="margin-top:12px">'+DP_REWARDS.map(r=>'<div class="row '+(dpLevel()>=r[0]?'':'locked')+'"><b>Nivå '+r[0]+' · '+r[1]+'</b><span>'+(dpLevel()>=r[0]?'🔓':'🔒')+'</span></div>').join('')+'</div></div><div class="card" style="margin-top:12px"><h2>🛍️ Profilshop</h2><p class="muted">Du tjänar 🪙 när du spelar.</p><div class="shop">'+DP_SHOP.map(x=>{let own=DP.owned.includes(x.id),can=dpLevel()>=x.level;return '<div class="shopItem '+(own?'owned ':'')+(!can?'locked':'')+'"><span class="tag">'+x.type+' · nivå '+x.level+'</span><h3>'+x.name+'</h3><p>'+x.cost+' 🪙</p>'+(own?'<button class="btn" onclick="dpEquip('+JSON.stringify(x.id)+')">Använd</button>':can?'<button class="btn primary" onclick="dpBuy('+JSON.stringify(x.id)+')">Köp</button>':'<button class="btn" disabled>🔒 Låst</button>')+'</div>'}).join('')+'</div></div>')}
function dpBuy(id){let x=DP_SHOP.find(s=>s.id===id);if(!x||DP.owned.includes(id)||dpLevel()<x.level||DP.coins<x.cost)return;DP.coins-=x.cost;DP.owned.push(id);dpSave();showProfile()}function dpEquip(id){let x=DP_SHOP.find(s=>s.id===id);if(!x)return;if(x.type==='Bakgrund')DP.bg=x.cls;if(x.type==='Textstil')DP.font=x.cls;if(x.type==='Avatar')DP.avatar=id;document.body.className=DP.font+' '+DP.bg;dpSave();showProfile()}function dpBoot(){let nav=document.querySelector('.nav');if(nav&&!document.getElementById('n6')){let b=document.createElement('button');b.id='n6';b.textContent='👤 Profil';b.onclick=showProfile;nav.appendChild(b)}let top=document.querySelector('.user small');if(top&&!document.getElementById('coins'))top.innerHTML=top.innerHTML.replace('</span> XP','</span> XP · <span id="coins">0</span> 🪙');DP=dpLoad();document.body.className=DP.font+' '+DP.bg;dpSave()}dpBoot();
</script>
</body>
</html>
